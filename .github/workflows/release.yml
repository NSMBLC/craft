name: Release

# Pushing a tag vX.Y.Z publishes a GitHub Release: the tag must match the version in pyproject.toml and a
# dated "## X.Y.Z — YYYY-MM-DD" section in CHANGELOG.md, whose text becomes the release notes. The wheel
# and sdist are built, installed and smoke-tested, then attached. Run it by hand to (re)publish an
# existing tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.2.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v6

      - name: Check the tag matches pyproject.toml and CHANGELOG.md
        run: |
          version="${TAG#v}"
          project=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$project" != "$version" ]; then
            echo "::error::tag $TAG but pyproject.toml says $project"; exit 1
          fi
          if ! grep -Eq "^## ${version//./\\.} — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated '## $version — YYYY-MM-DD' section"; exit 1
          fi
          awk -v v="$version" '
            $0 ~ "^## " v " " { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::the CHANGELOG.md section for $version is empty"; exit 1
          fi

      - name: Build and smoke-test the wheel
        run: |
          uv build
          uv tool install dist/*.whl
          test "$(craft --version)" = "craft ${TAG#v}"
          craft init --path "$RUNNER_TEMP/programme"
          grep -Eq "^craft_version: \"?${TAG#v}\"?( |$)" "$RUNNER_TEMP/programme/craft.yaml"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "CRAFT ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "CRAFT ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi
