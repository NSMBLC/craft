[project]
name = "craft-research"
version = "0.1.0"
description = "CRAFT: disciplined computational research inside a GenAI session"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.scripts]
craft = "craft.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/craft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["checkpoint(ids): CRAFT journey checkpoints covered by the test"]
